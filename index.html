<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Jaringan Komputer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f7;
  --kartu: #ffffff;
  --teks: #14213d;
  --teks-redup: #5b667a;
  --garis: #d6dde8;
  --aksen: #0047ab;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522;
    --kartu: #172033;
    --teks: #e8edf6;
    --teks-redup: #98a4ba;
    --garis: #2a3650;
    --aksen: #1e60c8;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
header p { margin: 0; color: var(--teks-redup); }
.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 160px; }
.kontrol input:focus-visible, .kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}
.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}
.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
}
.pita { height: 56px; background: #0047ab; }
.isi { padding: 0 16px 16px; text-align: center; }
.foto {
  width: 76px; height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #e6effa;
  color: #0047ab;
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; overflow: hidden;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0; text-align: left; font-size: 0.9rem; }
.rincian div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; }
.pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
.pesan.galat { color: #b42318; }
@media (prefers-color-scheme: dark) { .pesan.galat { color: #ff8b80; } }
</style>
</head>
<body>
<div class="wadah">
  <header>
    <h1>Teknik Komputer Jaringan</h1>
    <p>Cari berdasarkan role</p>
  </header>
  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari data Guru/Siswa" aria-label="Cari nama atau NIS">
    <select id="filterRole" aria-label="Filter Role">
      <option value="">Semua (Guru / Siswa)</option>
      <option value="siswa">Siswa</option>
      <option value="guru">Guru</option>
    </select>
    <select id="filterKelas" aria-label="Filter kelas atau mapel">
      <option value="">Semua kelas / mapel</option>
    </select>
  </div>
  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// --- KONFIGURASI SUPABASE ---
const SUPABASE_URL = "https://wvvmhxeuhyeqeqqwphlf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2dm1oeGV1aHllcWVxcXdwaGxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NzkwMjksImV4cCI6MjEwNzQ1NTAyOX0.3MFSSagPmF2jJ8YJ5vp3pEzzPcGOQ3_MZvr-mTf1HEA";

const TAMPILKAN = {
  jenisKelamin: true,
  tanggalLahir: true,
  alamat: true,
  foto_url: true
};

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elRole = document.getElementById("filterRole");
const elKelas = document.getElementById("filterKelas");
let semuaSiswa = [];

async function muatData() {
  tampilkanPesan("Memuat data...");
  
  const { data: dataSiswa } = await db
    .from("siswa")
    .select("nis, nama, kelas, jenis_kelamin, tanggal_lahir, alamat, foto_url")
    .order("nama");

  const { data: dataGuru } = await db
    .from("guru")
    .select("nip, nama, jurusan, mapel, foto_url")
    .order("nama");

  let gabungan = [];
  if (dataSiswa) gabungan = gabungan.concat(dataSiswa.map(s => ({ ...s, role: "siswa" })));
  if (dataGuru) gabungan = gabungan.concat(dataGuru.map(g => ({ ...g, role: "guru" })));

  semuaSiswa = gabungan;
  isiPilihanKelas();
  tampilkanSiswa();
}

function tampilkanSiswa() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const roleDipilih = elRole.value;
  const subDipilih = elKelas.value;

  const hasil = semuaSiswa.filter((s) => {
    const cocokRole = !roleDipilih || s.role === roleDipilih;
    const cocokSub = !subDipilih || s.kelas === subDipilih || s.mapel === subDipilih;
    
    const nama = (s.nama || "").toLowerCase();
    const id = (s.nis || s.nip || "").toLowerCase();
    const cocokCari = !kataKunci || nama.includes(kataKunci) || id.includes(kataKunci);
    
    return cocokRole && cocokSub && cocokCari;
  });

  elJumlah.textContent = hasil.length + " dari " + semuaSiswa.length + " data";
  elDaftar.replaceChildren();

  if (hasil.length === 0) {
    tampilkanPesan(semuaSiswa.length === 0 ? "Belum ada data. Tambahkan data lewat Table Editor di Supabase." : "Tidak ada data yang cocok. Coba kata kunci lain.");
    return;
  }

  hasil.forEach((s) => elDaftar.appendChild(buatKartu(s)));
}

function buatKartu(s) {
  const kartu = el("article", "kartu");
  kartu.appendChild(el("div", "pita"));
  const isi = el("div", "isi");

  const foto = el("div", "foto");
  if (s.foto_url) {
    const gambar = document.createElement("img");
    gambar.src = s.foto_url;
    gambar.alt = "Foto " + s.nama;
    gambar.loading = "lazy";
    gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(s.nama)));
    foto.appendChild(gambar);
  } else {
    foto.textContent = inisial(s.nama);
  }

  isi.appendChild(foto);
  isi.appendChild(el("h2", "nama", s.nama));
  isi.appendChild(el("p", "nis", s.role === "guru" ? ("NIP " + (s.nip || "-")) : ("NIS " + (s.nis || "-"))));

  const rincian = el("dl", "rincian");
  
  if (s.role === "guru") {
    tambahBaris(rincian, "Jurusan", s.jurusan);
    tambahBaris(rincian, "Mapel", s.mapel);
  } else {
    tambahBaris(rincian, "Kelas", s.kelas);
    if (TAMPILKAN.jenisKelamin) tambahBaris(rincian, "Jenis kelamin", s.jenis_kelamin);
    if (TAMPILKAN.tanggalLahir) tambahBaris(rincian, "Tanggal lahir", formatTanggal(s.tanggal_lahir));
    if (TAMPILKAN.alamat) tambahBaris(rincian, "Alamat", s.alamat);
  }
  
  isi.appendChild(rincian);
  kartu.appendChild(isi);
  return kartu;
}

function el(tag, kelas, teks) {
  const e = document.createElement(tag);
  if (kelas) e.className = kelas;
  if (teks) e.textContent = teks;
  return e;
}

function tambahBaris(dl, label, nilai) {
  if (!nilai) return;
  const baris = el("div");
  baris.appendChild(el("dt", "", label));
  baris.appendChild(el("dd", "", nilai));
  dl.appendChild(baris);
}

function inisial(nama) {
  return nama.split(" ").filter(Boolean).slice(0, 2).map((k) => k[0].toUpperCase()).join("");
}

function formatTanggal(teks) {
  if (!teks) return "";
  return new Date(teks + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}

function tampilkanPesan(teks, galat) {
  elDaftar.replaceChildren(el("p", "pesan" + (galat ? " galat" : ""), teks));
}

function isiPilihanKelas() {
  const role = elRole.value;
  elKelas.replaceChildren();

  const optDefault = el("option", "", role === "guru" ? "Semua Mapel" : (role === "siswa" ? "Semua Kelas" : "Semua Kelas / Mapel"));
  optDefault.value = "";
  elKelas.appendChild(optDefault);

  let daftar = [];
  if (role === "siswa") {
    daftar = [...new Set(semuaSiswa.filter(s => s.role === "siswa").map(s => s.kelas).filter(Boolean))];
  } else if (role === "guru") {
    daftar = [...new Set(semuaSiswa.filter(s => s.role === "guru").map(s => s.mapel).filter(Boolean))];
  } else {
    const k = semuaSiswa.filter(s => s.role === "siswa").map(s => s.kelas).filter(Boolean);
    const m = semuaSiswa.filter(s => s.role === "guru").map(s => s.mapel).filter(Boolean);
    daftar = [...new Set([...k, ...m])];
  }

  daftar.sort().forEach((k) => {
    const opsi = el("option", "", k);
    opsi.value = k;
    elKelas.appendChild(opsi);
  });
}

elRole.addEventListener("change", () => {
  isiPilihanKelas();
  tampilkanSiswa();
});
elCari.addEventListener("input", tampilkanSiswa);
elKelas.addEventListener("change", tampilkanSiswa);
muatData();
</script>
</body>
</html>
